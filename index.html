<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Proyek</title>
<!-- model-viewer (Apache 2.0) dari CDN -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1b; font-family: system-ui, sans-serif; }
  model-viewer { width: 100%; height: 100%; --poster-color: #1b1b1b; }
  #arBtn { position: absolute; top: 12px; right: 12px; padding: 12px 16px; border: 0;
           border-radius: 8px; background: #c62828; color: #fff; font-size: 16px; font-weight: 600; }
  .panel { position: absolute; left: 8px; right: 8px; bottom: 12px; padding: 10px 12px;
           border-radius: 10px; background: rgba(0,0,0,.65); color: #fff; font-size: 14px; }
  .panel label { display: block; margin: 4px 0; }
  .panel select, .panel input[type=range] { width: 100%; font-size: 15px; }
  #petunjuk { position: absolute; top: 12px; left: 12px; right: 170px; padding: 8px 10px;
              border-radius: 8px; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; display: none; }
  model-viewer[ar-status="session-started"] #petunjuk,
  model-viewer[ar-status="object-placed"] #petunjuk { display: block; }
</style>
</head>
<body>
<model-viewer id="mv" src="model.glb" alt="Model 3D proyek"
  ar ar-modes="webxr scene-viewer" ar-scale="fixed" ar-placement="floor"
  camera-controls touch-action="pan-y" shadow-intensity="0">

  <button slot="ar-button" id="arBtn">Lihat di Lokasi (AR)</button>

  <div id="petunjuk">
    Gerakkan ponsel perlahan ke lantai. Seret model dengan 1 jari sampai silang merah
    tepat di marka; putar dengan 2 jari sampai panah sejajar as.
  </div>

  <div class="panel" id="panel">
    <label>Tampilan
      <!-- Tidak perlu diubah: daftar terisi otomatis dari file yang ada
           (model.glb, layer1.glb sampai layer5.glb) -->
      <select id="pilihModel">
        <option value="model.glb">Model lengkap</option>
      </select>
    </label>
    <label>Transparansi: <span id="nilai">0%</span>
      <input id="transparansi" type="range" min="0" max="90" step="5" value="0">
    </label>
    <div id="status">Memuat model…</div>
  </div>
</model-viewer>

<script type="module">
  const mv = document.getElementById('mv');
  const slider = document.getElementById('transparansi');
  const nilai = document.getElementById('nilai');
  const pilih = document.getElementById('pilihModel');
  const status = document.getElementById('status');
  const panel = document.getElementById('panel');
  let asli = [];

  // Sentuhan pada panel tidak ikut menggeser model saat AR
  panel.addEventListener('beforexrselect', (e) => e.preventDefault());

  function terapkanTransparansi() {
    const t = Number(slider.value) / 100;
    nilai.textContent = slider.value + '%';
    if (!mv.model) return;
    mv.model.materials.forEach((m, i) => {
      if (/acuan/i.test(m.name)) return;           // silang acuan selalu pekat
      const a = asli[i];
      if (!a) return;
      m.setAlphaMode(t > 0 ? 'BLEND' : a.mode);
      m.pbrMetallicRoughness.setBaseColorFactor([a.warna[0], a.warna[1], a.warna[2], a.warna[3] * (1 - t)]);
    });
  }

  mv.addEventListener('load', () => {
    asli = mv.model.materials.map((m) => ({
      mode: m.getAlphaMode(),
      warna: Array.from(m.pbrMetallicRoughness.baseColorFactor)
    }));
    terapkanTransparansi();
    status.textContent = mv.canActivateAR
      ? 'Siap. Tekan "Lihat di Lokasi (AR)".'
      : 'Mode 3D. AR tidak tersedia di perangkat/browser ini.';
  });

  mv.addEventListener('error', () => {
    status.textContent = 'Gagal memuat file model. Periksa nama file .glb.';
  });

  mv.addEventListener('ar-status', (e) => {
    const s = e.detail.status;
    if (s === 'session-started') status.textContent = 'Arahkan kamera ke lantai, gerakkan perlahan…';
    if (s === 'object-placed') status.textContent = 'Model terpasang. Selaraskan silang acuan dengan marka.';
    if (s === 'failed') status.textContent = 'AR gagal dimulai. Pastikan Chrome & Google Play Services for AR terpasang.';
    if (s === 'not-presenting') status.textContent = 'Keluar dari AR.';
  });

  mv.addEventListener('ar-tracking', (e) => {
    if (e.detail.status === 'not-tracking') status.textContent = 'Pelacakan hilang: arahkan ke area bertekstur, cukup cahaya.';
  });

  // Tambahkan otomatis layer1.glb ... layer5.glb jika file-nya ada
  (async () => {
    for (let n = 1; n <= 5; n++) {
      try {
        const r = await fetch('layer' + n + '.glb', { method: 'HEAD', cache: 'no-store' });
        if (r.ok) pilih.add(new Option('Layer ' + n, 'layer' + n + '.glb'));
      } catch (e) { /* abaikan */ }
    }
  })();

  slider.addEventListener('input', terapkanTransparansi);
  pilih.addEventListener('change', () => {
    status.textContent = 'Memuat model…';
    mv.src = pilih.value;
  });
</script>
</body>
</html>
